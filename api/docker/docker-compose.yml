name: aqua-watch

services:
  app:
    build:
      context: ../
      dockerfile: ./docker/dockerfile
    container_name: aqua-watch-app
    command:
      [
        "bash",
        "-c",
        "sleep 10 && alembic upgrade head && python -m app.server --address 0.0.0.0",
      ]
    ports:
      - "8000:8000"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # JWE_KEY: ${JWE_KEY}
      DB_HOST: database
      DB_CONNECTION: postgresql
      SQLALCHEMY_DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@database:5432/aqua_db"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      REDIS_DB: 0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}

    volumes:
      - ../app:/usr/src/app/app # Mount apenas o diretório app para hot reload
    depends_on:
      - database
      - redis
    networks:
      - main-network

  database:
    image: postgres:15
    container_name: aqua-watch-database
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: aqua_db
    ports:
      - "5432:5432"
    volumes:
      - ./db_content/:/var/lib/postgresql/data

    networks:
      - main-network

  redis:
    image: redis:7-alpine
    container_name: aqua-watch-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    networks:
      - main-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  main-network:
    driver: bridge

volumes:
  redis_data:
